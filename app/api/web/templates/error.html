<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell result-shell">
      <section class="topbar" aria-label="审计异常">
        <div>
          <p class="eyebrow">Error {{ status_code }}</p>
          <h1>{{ title }}</h1>
        </div>
        <a class="ghost-link" href="/">返回工作台</a>
      </section>

      <section class="upload-panel result-panel">
        <p class="error">{{ message }}</p>
        <a class="download-link" href="/">重新上传</a>
      </section>
    </main>
  </body>
</html>

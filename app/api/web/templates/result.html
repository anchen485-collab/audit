<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>审计完成</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell result-shell">
      <section class="topbar" aria-label="审计完成">
        <div>
          <p class="eyebrow">Audit Complete</p>
          <h1>审计结果已生成</h1>
        </div>
        <a class="ghost-link" href="/">返回工作台</a>
      </section>

      <section class="upload-panel result-panel">
        <div>
          <p class="file-title">Excel 结果文件已准备好</p>
          <p class="file-name">可以下载审计明细和人员汇总，也可以返回首页继续上传。</p>
        </div>
        <a class="download-link primary-link" href="/audit/download/{{ job_id }}">下载审计结果 Excel</a>
      </section>

      {% if steps %}
      <section class="table-section">
        <div class="section-head">
          <h2>处理步骤</h2>
        </div>
        <ul class="steps">
          {% for step in steps %}
          <li>{{ step }}</li>
          {% endfor %}
        </ul>
      </section>
      {% endif %}
    </main>
  </body>
</html>

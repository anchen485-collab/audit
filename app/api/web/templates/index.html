<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>审计工作台</title>
    <link rel="stylesheet" href="/static/styles.css?v=detail-table-20260731" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="审计工作台">
        <div>
          <p class="eyebrow">Audit Agent</p>
          <h1>审计工作台</h1>
        </div>
        <a class="ghost-link" href="/docs" target="_blank" rel="noreferrer">API 文档</a>
      </section>

      <section class="upload-panel">
        <form id="uploadForm" class="upload-form" action="/audit/upload" method="post" enctype="multipart/form-data">
          <label class="file-picker" for="excelFile">
            <span class="file-title">选择员工录入 Excel</span>
            <span id="fileName" class="file-name">仅支持 .xlsx</span>
            <input id="excelFile" name="employee_file" type="file" accept=".xlsx" required />
          </label>
          <button id="submitButton" type="submit">开始审计</button>
        </form>
        <div id="statusMessage" class="status-message" role="status">等待上传</div>
      </section>

      <section id="metrics" class="metrics" aria-label="审计指标"></section>

      <section class="table-section">
        <div class="section-head">
          <h2>审计明细</h2>
          <div class="table-actions">
            <select id="actionFilter" aria-label="审计动作筛选">
              <option value="">全部动作</option>
              <option value="approved">自动通过</option>
              <option value="rejected">自动驳回</option>
              <option value="needs_more_evidence">证据不足</option>
              <option value="needs_human_review">人工复核</option>
            </select>
            <a id="downloadLink" class="download-link is-hidden" href="#">下载 Excel</a>
          </div>
        </div>
        <div class="table-wrap">
          <table class="audit-detail-table">
            <colgroup>
              <col class="col-person" />
              <col class="col-company" />
              <col class="col-website" />
              <col class="col-level1" />
              <col class="col-subcategory" />
              <col class="col-action" />
              <col class="col-confidence" />
              <col class="col-risk" />
              <col class="col-review" />
              <col class="col-reason" />
              <col class="col-suggestion" />
            </colgroup>
            <thead>
              <tr>
                <th>录入人员</th>
                <th>公司名称</th>
                <th>公司官网</th>
                <th>一级分类</th>
                <th>细分</th>
                <th>审计动作</th>
                <th>置信度</th>
                <th>风险分</th>
                <th>人工复核</th>
                <th>审计原因</th>
                <th>处理建议</th>
              </tr>
            </thead>
            <tbody id="resultRows">
              <tr>
                <td colspan="11" class="empty-cell">暂无审计结果</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="table-section">
        <div class="section-head">
          <h2>人工复核任务</h2>
          <span id="reviewCount" class="subtle-count">0 条</span>
        </div>
        <div class="table-wrap compact">
          <table class="review-task-table">
            <thead>
              <tr>
                <th>任务 ID</th>
                <th>审计单 ID</th>
                <th>优先级</th>
                <th>原因</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="reviewRows">
              <tr>
                <td colspan="5" class="empty-cell">暂无人工复核任务</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/static/app.js?v=detail-table-20260731"></script>
  </body>
</html>

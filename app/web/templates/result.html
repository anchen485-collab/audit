<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>审计完成</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="masthead">
          <p class="eyebrow">Audit Complete</p>
          <h1>审计结果已生成</h1>
          <p>你可以下载 Excel 查看审计明细和人员汇总。</p>
        </div>
        <a class="download" href="/audit/download/{{ job_id }}">下载审计结果 Excel</a>
        <ul class="steps">
          {% for step in steps %}
          <li>{{ step }}</li>
          {% endfor %}
        </ul>
      </section>
    </main>
  </body>
</html>
